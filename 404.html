<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | John Kyle P. Uriarte</title>
<link id="icon" rel="icon" type="image/png" href="images/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#bfeaff;--paper:#fff;--ink:#10264a;--mute:#3d5a85;--sun:#ffd23f;--shadow:#10264a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f2547;--paper:#17335f;--ink:#f2f8ff;--mute:#a9c4ec;--shadow:#04101f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:400 18px/1.5 Fredoka,"Trebuchet MS",system-ui,sans-serif}
main{max-width:520px;width:100%;background:var(--paper);border:3px solid var(--shadow);box-shadow:6px 6px 0 var(--shadow);border-radius:32px;padding:38px;text-align:center}
.code{font-size:clamp(4rem,18vw,6.5rem);font-weight:700;line-height:1;margin:0;letter-spacing:-.03em}
h1{font-size:1.8rem;margin:8px 0 10px}
p{margin:0 0 24px;color:var(--mute)}
a.btn{display:inline-block;padding:13px 28px;border-radius:999px;font-weight:600;font-size:1.05rem;background:var(--sun);color:#10264a;border:3px solid var(--shadow);box-shadow:4px 4px 0 var(--shadow);text-decoration:none}
a.btn:focus-visible{outline:3px solid #1d4ed8;outline-offset:3px}
a.btn{min-height:44px}
.more{margin:22px 0 0;font-size:1rem;color:var(--mute)}
.more a{display:inline-block;padding:10px 6px;color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.more a:focus-visible{outline:3px solid #1d4ed8;outline-offset:3px}
@media (prefers-color-scheme:dark){a.btn:focus-visible{outline-color:#ffd23f}}
</style>
</head>
<body>
<main>
  <p class="code" aria-hidden="true">404</p>
  <h1>Page not found</h1>
  <p>Sorry, that page doesn’t exist or may have moved. Let’s get you back to my portfolio.</p>
  <a class="btn" id="home" href="/Project-Midterm/">Back to home</a>
  <p class="more">Or jump to: <a id="to-projects" href="/Project-Midterm/#projects">Projects</a> <a id="to-contact" href="/Project-Midterm/#contact">Contact</a></p>
</main>
<script>
/* point the button at the right place whether the site is a project site or a user site */
(function(){
  var REPO='/Project-Midterm/';   /* change this if the repository is renamed; use '/' for a user site */
  var onProject=location.pathname.indexOf(REPO)===0||location.pathname+'/'===REPO;
  var base=onProject?REPO:'/';
  document.getElementById('home').setAttribute('href',base);
  document.getElementById('to-projects').setAttribute('href',base+'#projects');
  document.getElementById('to-contact').setAttribute('href',base+'#contact');
  document.getElementById('icon').setAttribute('href',base+'images/favicon.png');
})();
</script>
</body>
</html>
